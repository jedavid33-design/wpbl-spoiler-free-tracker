<!DOCTYPE html>
<html>
<head>
    <title>WPBL Spoiler-Free Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css?v=5">
<link rel="apple-touch-icon" href="icon.PNG">
<link rel="icon" type="image/png" href="icon.PNG">
</head>

<body>

    <main class="app">

        <section id="gamePicker" class="game-picker">
            <h1>⚾ Julie's WPBL Game Day ⚾</h1>
            <p>Choose a game</p>

            <div class="date-controls">
                <button onclick="showGamesForDate('yesterday')">Yesterday</button>
                <button onclick="showGamesForDate('today')">Today</button>

                <br><br>

                <input type="date" id="pickerDate">
                <button onclick="showGamesForDate('picked')">Load Date</button>
            </div>

            <div id="gameChoices"></div>
        </section>


        <section id="trackerScreen" class="hidden">

            <button onclick="returnToGamePicker()">
                ← Choose Another Game
            </button>

            <h1>⚾ Julie's WPBL Game Day ⚾</h1>

            <button onclick="previousEvent()">
                Previous Event
            </button>

            <button onclick="nextAtBat()">
                Next At-Bat
            </button>

            <button onclick="nextInning()">
                Next Inning
            </button>

            <div id="status">
                Loading...
            </div>

            <button id="batterInfo" onclick="nextEvent()">
                Batter info will appear here.
            </button>

            <div id="eventList"></div>

        </section>


        <div id="lineupModal" class="modal hidden">
            <div class="modal-content">
                <button class="modal-close" onclick="closeLineup()">×</button>
                <h2 id="lineupTitle"></h2>
                <div id="lineupBody"></div>
            </div>
        </div>

    </main>

    <script src="script.js?v=7"></script>

</body>
</html>
